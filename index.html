<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food App Mockup</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell" id="admin-shell">
      <aside class="sidebar" id="sidebar" aria-label="Admin sidebar">
        <a class="sidebar-header" href="#/dashboard">
          <div class="sidebar-logo" aria-hidden="true">FA</div>
          <div class="sidebar-brand">
            <strong>Food App</strong>
            <span>Admin Dashboard</span>
          </div>
        </a>
        <div class="sidebar-sep"></div>
        <nav class="sidebar-content" id="sidebar-nav"></nav>
        <div class="sidebar-sep"></div>
        <div class="sidebar-footer">
          <button type="button" class="nav-item" disabled title="UI only">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <span>Theme</span>
          </button>
          <button type="button" class="nav-item" disabled title="UI only">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            <span>Logout</span>
          </button>
        </div>
      </aside>

      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <div class="main-inset">
        <header class="top-header">
          <button type="button" class="icon-btn" id="sidebar-toggle" aria-label="Toggle sidebar">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
          </button>
          <div class="header-sep"></div>
          <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></nav>
        </header>

        <main class="content-panel">
          <div id="page-content"></div>
        </main>
      </div>
    </div>

    <div id="form-shell" hidden></div>

    <div class="modal-backdrop" id="modal-backdrop"></div>

    <script src="js/data.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
